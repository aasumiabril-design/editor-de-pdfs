<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Pro | Suite Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librerías Core -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- Tesseract para OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .page-card .action-btns { opacity: 1; }
        @media (min-width: 768px) {
            .page-card .action-btns { opacity: 0; }
            .page-card:hover .action-btns { opacity: 1; }
        }
        .sortable-ghost { opacity: 0.1; transform: scale(0.95); background: #6366f1; }
        #previewModal { display: none; }
        #modalImageContainer { position: relative; display: flex; justify-content: center; overflow: hidden; width: 100%; max-height: 70vh; background: #0f172a; border-radius: 12px; }
        #modalImg { transform-origin: top left; max-width: 100%; user-select: none; -webkit-user-drag: none; }
        #drawCanvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: crosshair; touch-action: none; pointer-events: none;}
        #drawCanvas.active { pointer-events: auto; }
        
        #pagesGrid { counter-reset: pdf-counter; }
        .page-number::before { counter-increment: pdf-counter; content: counter(pdf-counter); }
        .mode-active { border-color: #6366f1 !important; background-color: #f5f7ff !important; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1); }
        
        #viewerMainArea::-webkit-scrollbar, #viewerSidebar::-webkit-scrollbar { width: 8px; height: 8px; }
        #viewerMainArea::-webkit-scrollbar-thumb, #viewerSidebar::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }
        .thumb-active { border: 2px solid #8ab4f8 !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <nav class="bg-white border-b border-slate-200 px-3 md:px-6 py-4 sticky top-0 z-40 shadow-sm flex justify-between items-center gap-2">
        <div class="flex items-center gap-2 shrink-0">
            <div class="bg-indigo-600 p-1.5 rounded-lg text-white"><i class="fas fa-magic text-lg"></i></div>
            <h1 class="text-sm md:text-xl font-bold tracking-tight text-slate-800 hidden sm:block">PDF Editor <span class="text-indigo-600">Pro</span></h1>
        </div>
        <div class="flex items-center gap-2 flex-1 justify-end">
            <input type="text" id="outputFileName" placeholder="Nombre (Opcional)" class="px-2 py-2 border border-slate-300 rounded-lg text-xs outline-none w-32 md:w-48">
            <button onclick="exportPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 md:px-5 py-2 rounded-lg font-bold text-xs md:text-sm shadow-md transition-all">Guardar PDF</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-10">
        <div id="dropzone" class="bg-white border-2 border-dashed border-indigo-200 rounded-2xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all mb-6 md:mb-8 group shadow-sm">
            <input type="file" id="fileInput" multiple accept=".pdf,image/*" class="hidden" onchange="handleFiles(this.files)">
            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-plus text-indigo-600 text-lg"></i></div>
            <h3 class="text-sm md:text-lg font-bold text-slate-700">Añadir archivos (PDF o Imágenes)</h3>
        </div>

        <div id="editorContainer" class="hidden border-t border-slate-200 pt-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-tight">Ordena y Edita</h2>
                <div class="flex gap-2">
                    <button onclick="openFullViewer()" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-indigo-200 transition-colors"><i class="fas fa-desktop"></i> Visor Avanzado</button>
                    <button onclick="clearAll()" class="bg-rose-50 text-rose-600 text-xs font-bold border border-rose-200 px-4 py-2 rounded-lg hover:bg-rose-100 transition-colors">Limpiar Todo</button>
                </div>
            </div>
            <div id="pagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 mb-20"></div>
        </div>
    </main>

    <!-- Modal Edición Individual (Recorte, Filtros, Firma, OCR) -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/98 z-[100] p-4 flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="w-full max-w-6xl flex flex-wrap justify-between items-center mb-4 text-white gap-2">
            <div class="flex flex-wrap gap-2 items-center bg-slate-800 p-2 rounded-lg">
                <!-- Herramientas -->
                <button onclick="startCrop()" id="cropBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-xs font-bold transition" title="Recortar"><i class="fas fa-crop-alt mr-1"></i> Recortar</button>
                <button onclick="applyFilter('bw')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-xs font-bold transition" title="Filtro B/N"><i class="fas fa-adjust mr-1"></i> B/N</button>
                <button onclick="applyFilter('contrast')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-xs font-bold transition" title="Mejorar Contraste"><i class="fas fa-sun mr-1"></i> Contraste</button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>
                <button onclick="toggleDraw('signature')" id="btnSign" class="bg-slate-700 hover:bg-indigo-600 px-3 py-2 rounded text-xs font-bold transition" title="Firmar (Negro)"><i class="fas fa-pen-nib mr-1"></i> Firmar</button>
                <button onclick="toggleDraw('highlight')" id="btnHighlight" class="bg-slate-700 hover:bg-yellow-600 px-3 py-2 rounded text-xs font-bold transition" title="Resaltar (Amarillo)"><i class="fas fa-highlighter mr-1"></i> Resaltar</button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>
                <button onclick="runOCR()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded text-xs font-bold transition"><i class="fas fa-font mr-1"></i> Leer Texto (OCR)</button>
                
                <!-- Acciones Confirmar/Cancelar -->
                <button onclick="confirmAction()" id="confirmActionBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-xs font-bold hidden ml-2">Guardar Cambios</button>
                <button onclick="cancelAction()" id="cancelActionBtn" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded text-xs font-bold hidden">Cancelar</button>
            </div>
            <button onclick="closePreview()" class="w-10 h-10 bg-slate-800 hover:bg-rose-600 text-white rounded-full flex items-center justify-center transition shadow-lg"><i class="fas fa-times"></i></button>
        </div>
        
        <div id="modalImageContainer" class="relative">
            <img id="modalImg" src="">
            <canvas id="drawCanvas"></canvas>
        </div>
        <div id="cropperContainer" class="rounded-xl overflow-hidden hidden w-full flex justify-center max-h-[70vh]"><img id="cropperImg" src=""></div>
    </div>

    <!-- Visor Avanzado (Scroll Vertical Continuo) -->
    <div id="fullViewerModal" class="hidden fixed inset-0 bg-[#323639] z-[150] flex flex-col">
        <div class="h-14 bg-[#323639] border-b border-gray-600 flex justify-between items-center px-4 text-white select-none shadow-md z-10">
            <div class="flex items-center gap-4">
                <button onclick="closeFullViewer()" class="text-gray-300 hover:text-white hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-arrow-left"></i></button>
                <span class="text-sm font-semibold text-gray-200">Visor de Documento</span>
            </div>
            <div class="flex items-center gap-2 md:gap-4 text-gray-300">
                <div class="flex items-center bg-gray-800 px-3 py-1 rounded text-xs gap-1">Pág <span id="viewerCurrentPage">1</span> de <span id="viewerTotalPages">1</span></div>
                <button onclick="viewerZoomOut()" class="hover:bg-gray-700 p-2 rounded-full"><i class="fas fa-minus"></i></button>
                <span id="viewerZoomLabel" class="text-xs font-mono w-10 text-center">100%</span>
                <button onclick="viewerZoomIn()" class="hover:bg-gray-700 p-2 rounded-full"><i class="fas fa-plus"></i></button>
            </div>
        </div>
        <div class="flex flex-1 overflow-hidden">
            <!-- Barra Lateral Sincronizada -->
            <div class="w-24 md:w-48 bg-[#202124] overflow-y-auto flex flex-col items-center py-4 gap-4" id="viewerSidebar"></div>
            <!-- Área Principal (Scroll Continuo) -->
            <div class="flex-1 bg-[#525659] overflow-y-auto p-4 md:p-8 relative" id="viewerMainArea" onscroll="handleViewerScroll()">
                <div id="viewerImagesContainer" class="flex flex-col gap-6 items-center w-full transform-origin-top transition-transform" style="transform: scale(1);">
                    <!-- Las imágenes se inyectan aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Resultados OCR -->
    <div id="ocrModal" class="hidden fixed inset-0 bg-slate-900/80 z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-2xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-800">Texto Extraído (OCR)</h3>
                <button onclick="document.getElementById('ocrModal').classList.add('hidden')" class="text-slate-400 hover:text-rose-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <textarea id="ocrResultText" class="w-full flex-1 p-4 border border-slate-200 rounded-lg text-sm bg-slate-50 outline-none focus:border-indigo-500 min-h-[200px]" readonly></textarea>
            <div class="mt-4 flex justify-end gap-2">
                <button onclick="copyOCR()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold"><i class="fas fa-copy mr-1"></i> Copiar Texto</button>
            </div>
        </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[300]">
        <div class="bg-white p-6 rounded-2xl flex flex-col items-center shadow-2xl">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-2"></div>
            <p class="text-xs font-bold mt-2 text-slate-700" id="loaderText">Procesando...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let allPages = []; let cropper = null; let currentEditingPageId = null; 
        let viewerZoom = 1; let isModalOpen = false;

        // Variables Dibujo
        let isDrawing = false; let drawMode = null; // 'signature' | 'highlight'
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let drawHistory = []; // Para poder guardar el trazo

        const pagesGrid = document.getElementById('pagesGrid');
        const loader = document.getElementById('loader');

        new Sortable(pagesGrid, { animation: 150, ghostClass: 'sortable-ghost', delay: 50, delayOnTouchOnly: true });

        // Navegación (Atrás/ESC)
        window.addEventListener('popstate', () => {
            if (isModalOpen) { closePreview(true); closeFullViewer(true); }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if(document.getElementById('previewModal').style.display === 'flex') closePreview(true);
                else if(!document.getElementById('fullViewerModal').classList.contains('hidden')) closeFullViewer(true);
            }
        });

        async function handleFiles(files) {
            if (files.length === 0) return;
            showLoader("Cargando archivos...");
            document.getElementById('editorContainer').classList.remove('hidden');

            for (const file of files) {
                if (file.type === "application/pdf") {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({scale: 2.0});
                        const cvs = document.createElement('canvas');
                        cvs.height = viewport.height; cvs.width = viewport.width;
                        await page.render({canvasContext: cvs.getContext('2d'), viewport: viewport}).promise;
                        addPageToGrid(cvs.toDataURL('image/jpeg', 0.95));
                    }
                } else if (file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = (e) => addPageToGrid(e.target.result);
                    reader.readAsDataURL(file);
                }
            }
            hideLoader();
        }

        function addPageToGrid(displayData) {
            const pageId = Math.random().toString(36).substr(2, 9);
            allPages.push({ id: pageId, currentData: displayData, originalCrop: displayData });
            const div = document.createElement('div');
            div.className = 'page-card group relative bg-white border border-slate-200 rounded-xl p-2 shadow-sm flex flex-col justify-between';
            div.dataset.id = pageId;
            div.innerHTML = `
                <div class="page-number absolute -top-2 -left-2 bg-indigo-600 text-white w-6 h-6 rounded flex items-center justify-center text-[10px] font-bold z-10 border-2 border-white shadow"></div>
                <div class="relative w-full h-32 md:h-40 flex items-center justify-center bg-slate-100 rounded-lg overflow-hidden cursor-pointer" onclick="openPreview('${pageId}')">
                    <img src="${displayData}" class="thumbnail-img object-contain w-full h-full">
                </div>
                <div class="action-btns absolute top-3 right-3 z-20 flex flex-col gap-2">
                    <button onclick="event.stopPropagation(); deletePage('${pageId}')" class="w-8 h-8 bg-rose-600 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-rose-700 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
            `;
            pagesGrid.appendChild(div);
        }

        // ==========================================
        // EXPORTACIÓN PDF
        // ==========================================
        async function exportPDF() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return;
            showLoader("Generando PDF final...");
            
            try {
                const mergedPdf = await PDFLib.PDFDocument.create();
                for (const item of items) {
                    const pageObj = allPages.find(p => p.id === item.dataset.id);
                    const parts = pageObj.currentData.split(',');
                    const u8arr = new Uint8Array(atob(parts[1]).split('').map(c => c.charCodeAt(0)));
                    
                    const img = pageObj.currentData.includes("image/png") 
                        ? await mergedPdf.embedPng(u8arr) 
                        : await mergedPdf.embedJpg(u8arr);
                    
                    const page = mergedPdf.addPage([img.width, img.height]);
                    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                }
                
                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = (document.getElementById('outputFileName').value || "Documento_Editado") + ".pdf";
                link.click();
            } catch (e) { alert("Error al generar PDF."); }
            hideLoader();
        }

        // ==========================================
        // MODAL EDICIÓN Y FILTROS
        // ==========================================
        function openPreview(pageId) {
            currentEditingPageId = pageId;
            const pageObj = allPages.find(p => p.id === pageId);
            const img = document.getElementById('modalImg');
            
            img.onload = () => { resizeCanvas(); }; // Ajustar canvas al cargar imagen
            img.src = pageObj.currentData;
            
            document.getElementById('previewModal').style.display = 'flex';
            history.pushState({ modalOpen: true }, ''); isModalOpen = true;
            resetEditTools();
        }

        function closePreview(fromHistory = false) {
            if (isModalOpen && !fromHistory) { history.back(); return; }
            resetEditTools();
            document.getElementById('previewModal').style.display = 'none';
            isModalOpen = false;
        }

        function resetEditTools() {
            cancelAction();
            drawMode = null; canvas.classList.remove('active');
            document.getElementById('btnSign').classList.remove('bg-indigo-600');
            document.getElementById('btnHighlight').classList.remove('bg-yellow-600');
        }

        // --- Filtros ---
        function applyFilter(type) {
            showLoader("Aplicando filtro...");
            setTimeout(() => {
                const img = document.getElementById('modalImg');
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = img.naturalWidth; tempCanvas.height = img.naturalHeight;
                const tempCtx = tempCanvas.getContext('2d');
                
                if(type === 'bw') tempCtx.filter = 'grayscale(100%) contrast(150%) brightness(110%)';
                if(type === 'contrast') tempCtx.filter = 'contrast(130%) saturate(120%)';
                
                tempCtx.drawImage(img, 0, 0);
                saveModifiedImage(tempCanvas.toDataURL('image/jpeg', 0.95));
                hideLoader();
            }, 50);
        }

        // --- Recorte (Cropper) ---
        function startCrop() {
            const pageObj = allPages.find(p => p.id === currentEditingPageId);
            document.getElementById('modalImageContainer').style.display = 'none';
            const cropperImg = document.getElementById('cropperImg');
            cropperImg.src = pageObj.currentData;
            document.getElementById('cropperContainer').classList.remove('hidden');
            
            showActionButtons();
            cropper = new Cropper(cropperImg, { viewMode: 1, autoCropArea: 1 });
        }

        // --- Dibujo / Firmas ---
        function resizeCanvas() {
            const img = document.getElementById('modalImg');
            // Mapeamos el tamaño lógico (natural) y el visual
            canvas.width = img.naturalWidth; 
            canvas.height = img.naturalHeight;
            canvas.style.width = img.clientWidth + 'px';
            canvas.style.height = img.clientHeight + 'px';
        }

        window.addEventListener('resize', () => {
            if(document.getElementById('previewModal').style.display === 'flex') resizeCanvas();
        });

        function toggleDraw(mode) {
            if(drawMode === mode) {
                drawMode = null; canvas.classList.remove('active');
                document.getElementById('btnSign').classList.replace('bg-indigo-600', 'bg-slate-700');
                document.getElementById('btnHighlight').classList.replace('bg-yellow-600', 'bg-slate-700');
                document.getElementById('confirmActionBtn').classList.add('hidden');
                document.getElementById('cancelActionBtn').classList.add('hidden');
                return;
            }
            drawMode = mode;
            canvas.classList.add('active');
            showActionButtons();
            
            // Estilos UI
            document.getElementById('btnSign').classList.toggle('bg-indigo-600', mode === 'signature');
            document.getElementById('btnHighlight').classList.toggle('bg-yellow-600', mode === 'highlight');
            
            // Configurar Pincel
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            if(mode === 'signature') {
                ctx.strokeStyle = '#000000'; ctx.lineWidth = canvas.width * 0.005; // Grosor relativo
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.strokeStyle = 'rgba(255, 235, 59, 0.4)'; // Amarillo transparente
                ctx.lineWidth = canvas.width * 0.03;
                ctx.globalCompositeOperation = 'multiply'; // Efecto resaltador
            }
        }

        // Eventos de dibujo (Mouse / Touch)
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // Escalar coordenadas visuales a coordenadas lógicas del canvas
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        const startDraw = (e) => { if(!drawMode) return; isDrawing = true; const pos = getPointerPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
        const draw = (e) => { if(!isDrawing) return; e.preventDefault(); const pos = getPointerPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
        const endDraw = () => { if(isDrawing) { ctx.closePath(); isDrawing = false; } };

        canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw); canvas.addEventListener('mouseout', endDraw);
        canvas.addEventListener('touchstart', startDraw, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false});
        canvas.addEventListener('touchend', endDraw);

        // --- Acciones Comunes Modal ---
        function showActionButtons() {
            document.getElementById('confirmActionBtn').classList.remove('hidden');
            document.getElementById('cancelActionBtn').classList.remove('hidden');
        }

        function cancelAction() {
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('cropperContainer').classList.add('hidden');
            document.getElementById('modalImageContainer').style.display = 'flex';
            document.getElementById('confirmActionBtn').classList.add('hidden');
            document.getElementById('cancelActionBtn').classList.add('hidden');
            
            // Limpiar Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMode = null; canvas.classList.remove('active');
        }

        function confirmAction() {
            if (cropper) {
                saveModifiedImage(cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' }).toDataURL('image/jpeg', 0.95));
                cancelAction();
            } else if (drawMode) {
                // Fusionar imagen base + canvas de dibujo
                const mergedCanvas = document.createElement('canvas');
                mergedCanvas.width = canvas.width; mergedCanvas.height = canvas.height;
                const mCtx = mergedCanvas.getContext('2d');
                
                const baseImg = document.getElementById('modalImg');
                mCtx.drawImage(baseImg, 0, 0, mergedCanvas.width, mergedCanvas.height);
                mCtx.drawImage(canvas, 0, 0); // Dibujar trazos encima
                
                saveModifiedImage(mergedCanvas.toDataURL('image/jpeg', 0.95));
                cancelAction();
            }
        }

        function saveModifiedImage(dataUrl) {
            const idx = allPages.findIndex(p => p.id === currentEditingPageId);
            allPages[idx].currentData = dataUrl;
            document.querySelector(`[data-id="${currentEditingPageId}"] .thumbnail-img`).src = dataUrl;
            document.getElementById('modalImg').src = dataUrl;
            resizeCanvas(); // reajustar canvas a la nueva imagen
        }

        // ==========================================
        // OCR (Extracción de Texto)
        // ==========================================
        async function runOCR() {
            const pageObj = allPages.find(p => p.id === currentEditingPageId);
            showLoader("Analizando texto (esto puede tardar unos segundos)...");
            try {
                // Usamos Tesseract.js para español
                const result = await Tesseract.recognize(pageObj.currentData, 'spa', {
                    logger: m => console.log(m)
                });
                document.getElementById('ocrResultText').value = result.data.text;
                document.getElementById('ocrModal').classList.remove('hidden');
            } catch(e) {
                alert("Error al extraer texto. Asegúrate de tener conexión a internet para descargar el modelo de idioma.");
            }
            hideLoader();
        }

        function copyOCR() {
            const text = document.getElementById('ocrResultText');
            text.select(); document.execCommand('copy');
            alert("¡Texto copiado al portapapeles!");
        }

        // ==========================================
        // VISOR AVANZADO (SCROLL CONTINUO)
        // ==========================================
        function openFullViewer() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return;
            
            const sidebar = document.getElementById('viewerSidebar');
            const mainContainer = document.getElementById('viewerImagesContainer');
            sidebar.innerHTML = ''; mainContainer.innerHTML = '';
            
            document.getElementById('viewerTotalPages').innerText = items.length;
            viewerZoom = 1; updateViewerZoom();

            items.forEach((item, index) => {
                const pageObj = allPages.find(p => p.id === item.dataset.id);
                
                // 1. Crear Miniatura Sidebar
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'w-16 h-20 md:w-32 md:h-40 bg-white flex items-center justify-center cursor-pointer border-2 border-transparent transition-all shadow-sm relative viewer-thumb';
                thumbDiv.dataset.index = index;
                thumbDiv.onclick = () => scrollToPage(index);
                thumbDiv.innerHTML = `
                    <img src="${pageObj.currentData}" class="object-contain w-full h-full p-1">
                    <div class="absolute -bottom-5 text-gray-400 text-xs text-center w-full">${index + 1}</div>
                `;
                sidebar.appendChild(thumbDiv);
                
                // 2. Crear Imagen en Área Principal
                const mainImg = document.createElement('img');
                mainImg.src = pageObj.currentData;
                mainImg.className = 'viewer-page shadow-xl max-w-full';
                mainImg.dataset.index = index;
                // Ancho base del visor para que se vea legible
                mainImg.style.width = '800px'; 
                mainContainer.appendChild(mainImg);
            });
            
            document.getElementById('fullViewerModal').classList.remove('hidden');
            history.pushState({ modalOpen: true }, ''); isModalOpen = true;
            
            // Resaltar la primera página por defecto
            updateSidebarHighlight(0);
        }

        function scrollToPage(index) {
            const pages = document.querySelectorAll('.viewer-page');
            if(pages[index]) {
                // Hacer scroll suave hacia la imagen seleccionada en el contenedor principal
                pages[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Detectar qué página se está viendo al hacer scroll
        function handleViewerScroll() {
            const mainArea = document.getElementById('viewerMainArea');
            const pages = document.querySelectorAll('.viewer-page');
            
            let currentVisibleIndex = 0;
            let minDistance = Infinity;

            // Encontrar la imagen cuyo borde superior esté más cerca del inicio de la ventana
            pages.forEach((page, index) => {
                const rect = page.getBoundingClientRect();
                const distance = Math.abs(rect.top - mainArea.getBoundingClientRect().top);
                if(distance < minDistance) {
                    minDistance = distance;
                    currentVisibleIndex = index;
                }
            });

            updateSidebarHighlight(currentVisibleIndex);
        }

        function updateSidebarHighlight(index) {
            // Actualizar texto superior
            document.getElementById('viewerCurrentPage').innerText = index + 1;
            
            // Actualizar borde azul en barra lateral
            const thumbs = document.querySelectorAll('.viewer-thumb');
            thumbs.forEach((t, i) => {
                if(i === index) {
                    t.classList.add('thumb-active');
                    // Asegurar que la miniatura activa esté visible en la barra lateral
                    t.scrollIntoView({ behavior: 'auto', block: 'nearest' });
                } else {
                    t.classList.remove('thumb-active');
                }
            });
        }

        function viewerZoomIn() { viewerZoom += 0.25; updateViewerZoom(); }
        function viewerZoomOut() { viewerZoom = Math.max(0.25, viewerZoom - 0.25); updateViewerZoom(); }
        function updateViewerZoom() {
            document.getElementById('viewerImagesContainer').style.transform = `scale(${viewerZoom})`;
            document.getElementById('viewerZoomLabel').innerText = `${Math.round(viewerZoom * 100)}%`;
        }

        function closeFullViewer(fromHistory = false) { 
            if (isModalOpen && !fromHistory) { history.back(); return; }
            document.getElementById('fullViewerModal').classList.add('hidden'); 
            isModalOpen = false;
        }

        // ==========================================
        // UTILIDADES
        // ==========================================
        function showLoader(text) { 
            document.getElementById('loaderText').innerText = text;
            document.getElementById('loader').classList.remove('hidden'); 
        }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }
        function deletePage(id) { document.querySelector(`[data-id="${id}"]`).remove(); }
        function clearAll() { if(confirm("¿Borrar todos los documentos?")) location.reload(); }
    </script>
</body>
</html>
