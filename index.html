<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Pro | OCR & Firmas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- Tesseract para OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .page-card .action-btns { opacity: 1; }
        @media (min-width: 768px) {
            .page-card .action-btns { opacity: 0; }
            .page-card:hover .action-btns { opacity: 1; }
        }
        .sortable-ghost { opacity: 0.1; transform: scale(0.95); background: #6366f1; }
        #previewModal { display: none; }
        #modalImageContainer { display: flex; justify-content: center; overflow: auto; width: 100%; max-height: 70vh; background: #0f172a; border-radius: 12px; }
        #modalImg { transform-origin: top center; transition: transform 0.1s; max-width: 100%; }
        #pagesGrid { counter-reset: pdf-counter; }
        .page-number::before { counter-increment: pdf-counter; content: counter(pdf-counter); }
        .mode-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .mode-active { border-color: #6366f1 !important; background-color: #f5f7ff !important; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1); transform: translateY(-2px); }
        .mode-active .check-icon { display: flex !important; }
        
        #viewerMainArea::-webkit-scrollbar, #viewerSidebar::-webkit-scrollbar { width: 8px; height: 8px; }
        #viewerMainArea::-webkit-scrollbar-thumb, #viewerSidebar::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }
        #viewerMainArea::-webkit-scrollbar-track, #viewerSidebar::-webkit-scrollbar-track { background: transparent; }
        .thumb-active { border: 2px solid #8ab4f8 !important; }
        .tool-active { background-color: #4f46e5 !important; color: white !important; }
        
        /* Cursor styles per tool */
        .cursor-ocr { cursor: crosshair !important; }
        .cursor-draw { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23facc15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>') 0 16, auto !important; }
        .cursor-text { cursor: text !important; }
        .cursor-stamp { cursor: copy !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Navegación -->
    <nav class="bg-white border-b border-slate-200 px-3 md:px-6 py-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <div class="bg-indigo-600 p-1.5 rounded-lg text-white"><i class="fas fa-file-signature text-lg"></i></div>
                <h1 class="text-sm md:text-xl font-bold tracking-tight text-slate-800 hidden sm:block">PDF Editor <span class="text-indigo-600">Pro</span></h1>
            </div>
            
            <div class="flex items-center gap-2 flex-1 justify-end">
                <input type="text" id="outputFileName" placeholder="Nombre (Opcional)" class="px-2 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none w-32 md:w-48 transition-all">
                <button onclick="printEditedPDF()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-bold text-xs md:text-sm shadow-sm transition-all shrink-0">
                    <i class="fas fa-print"></i>
                </button>
                <button id="navSaveBtn" onclick="exportPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 md:px-5 py-2 rounded-lg font-bold text-xs md:text-sm shadow-md transition-all shrink-0">
                    Guardar PDF
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 md:px-6 py-6 md:py-10">
        <!-- Opciones PDF -->
        <section class="mb-6 md:mb-8 bg-white p-5 md:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Formato de Salida</h2>
                    <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <select id="pageSize" onchange="toggleManualSize()" class="bg-transparent text-sm font-bold px-2 py-1 outline-none text-indigo-600 w-full">
                            <option value="original">Original</option>
                            <option value="letter">Carta</option>
                            <option value="legal">Oficio</option>
                            <option value="manual">Personalizado</option>
                        </select>
                        <div id="manualInputs" class="hidden flex items-center gap-1 border-l border-slate-300 pl-2">
                            <input type="number" id="manualW" placeholder="W" class="w-12 text-[10px] p-1.5 border rounded">
                            <input type="number" id="manualH" placeholder="H" class="w-12 text-[10px] p-1.5 border rounded">
                        </div>
                    </div>
                </div>
                <div>
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Márgenes Globales</h2>
                    <select id="pageMargin" class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm font-bold text-indigo-600 outline-none w-full">
                        <option value="0">Sin margen</option>
                        <option value="20">Normal (20px)</option>
                        <option value="40">Ancho (40px)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Dropzone -->
        <div id="dropzone" class="bg-white border-2 border-dashed border-indigo-200 rounded-2xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all mb-6 md:mb-8 group shadow-sm">
            <input type="file" id="fileInput" multiple accept=".pdf,image/*" class="hidden" onchange="handleFiles(this.files)">
            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-plus text-indigo-600 text-lg"></i></div>
            <h3 class="text-sm md:text-lg font-bold text-slate-700">Añadir archivos (PDF o Imágenes)</h3>
        </div>

        <div id="editorContainer" class="hidden border-t border-slate-200 pt-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-tight">Ordena y Edita</h2>
                <div class="flex gap-2">
                    <button onclick="openFullViewer()" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-indigo-200 transition-colors"><i class="fas fa-desktop"></i> Visor Avanzado (Firma, OCR, Textos)</button>
                    <button onclick="clearAll()" class="bg-rose-50 text-rose-600 text-xs font-bold border border-rose-200 px-4 py-2 rounded-lg hover:bg-rose-100 transition-colors">Limpiar Todo</button>
                </div>
            </div>
            
            <div id="pagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 mb-20"></div>
        </div>
    </main>

    <!-- Modal Editar/Recortar/Filtros -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/98 z-[100] p-4 flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="w-full max-w-5xl flex justify-between items-center mb-4 text-white">
            <div class="flex gap-2 items-center flex-wrap">
                <button onclick="zoomIn()" class="bg-slate-800 hover:bg-slate-700 p-2 md:p-3 rounded-lg transition-colors"><i class="fas fa-search-plus"></i></button>
                <button onclick="zoomOut()" class="bg-slate-800 hover:bg-slate-700 p-2 md:p-3 rounded-lg transition-colors"><i class="fas fa-search-minus"></i></button>
                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                
                <!-- Magic Filters para Escaneo -->
                <button onclick="applyCropFilter('magic')" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 md:py-3 rounded-lg text-xs font-bold transition-colors shadow flex gap-1 items-center" title="Filtro de Escáner">
                    <i class="fas fa-magic"></i> Magia B/N
                </button>
                <button onclick="applyCropFilter('reset')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 md:py-3 rounded-lg text-xs font-bold transition-colors">Original</button>
                <div class="w-px h-6 bg-slate-700 mx-1"></div>

                <button onclick="startCrop()" id="cropBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 md:py-3 rounded-lg text-xs font-bold transition-colors">Recortar</button>
                <button onclick="confirmCrop()" id="confirmCropBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 md:py-3 rounded-lg text-xs font-bold hidden transition-colors">OK</button>
                <button onclick="cancelCrop()" id="cancelCropBtn" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 md:py-3 rounded-lg text-xs font-bold hidden transition-colors">X</button>
            </div>
            <button onclick="closePreview()" class="w-10 h-10 bg-slate-800 hover:bg-rose-600 text-white rounded-full flex items-center justify-center text-xl transition-colors shadow-lg shrink-0">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="modalImageContainer"><img id="modalImg" src=""></div>
        <div id="cropperContainer" class="rounded-xl overflow-hidden hidden w-full max-h-[70vh] flex justify-center bg-black"><img id="cropperImg" src=""></div>
    </div>

    <!-- Modal Crear Firma -->
    <div id="signatureModal" class="hidden fixed inset-0 bg-slate-900/80 z-[160] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-800 text-lg">Nueva Firma o Sello</h3>
                <button onclick="closeSignatureModal()" class="text-slate-400 hover:text-rose-600 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <p class="text-xs text-slate-500 mb-2">Dibuja tu firma en el recuadro:</p>
            <div class="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 cursor-crosshair mb-4">
                <canvas id="signaturePad" width="380" height="150" class="w-full touch-none rounded-xl"></canvas>
            </div>
            
            <div class="flex justify-between items-center mb-4 text-sm">
                <button onclick="clearSignature()" class="text-rose-500 font-bold hover:text-rose-700 text-xs">Limpiar Lienzo</button>
                <label class="text-indigo-600 font-bold cursor-pointer hover:text-indigo-800 text-xs flex items-center gap-1">
                    <i class="fas fa-upload"></i> Subir imagen (transparente)
                    <input type="file" accept="image/png, image/jpeg" class="hidden" onchange="uploadSignatureImage(this)">
                </label>
            </div>
            
            <button onclick="saveSignature()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition shadow-lg">Guardar y Usar</button>
        </div>
    </div>

    <!-- Modal Mostrar Resultado OCR -->
    <div id="ocrResultModal" class="hidden fixed inset-0 bg-slate-900/80 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-800 text-lg"><i class="fas fa-robot text-indigo-600 mr-2"></i>Texto Extraído (OCR)</h3>
                <button onclick="document.getElementById('ocrResultModal').classList.add('hidden')" class="text-slate-400 hover:text-rose-600 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <textarea id="ocrTextArea" class="w-full h-48 p-3 border border-slate-300 rounded-lg text-sm mb-4 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="El texto aparecerá aquí..."></textarea>
            <button onclick="copyOCRText()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-copy"></i> Copiar al Portapapeles
            </button>
        </div>
    </div>

    <!-- Modal Visor Avanzado -->
    <div id="fullViewerModal" class="hidden fixed inset-0 bg-[#323639] z-[150] flex flex-col">
        <div class="h-16 bg-[#323639] border-b border-gray-600 flex justify-between items-center px-4 text-white select-none shadow-md z-10">
            <div class="flex items-center gap-3">
                <button onclick="closeFullViewer()" class="text-gray-300 hover:text-white hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-arrow-left"></i></button>
                
                <!-- Herramientas Interactivas (Radio group behavior via JS) -->
                <div class="flex bg-gray-800 p-1 rounded-lg gap-1 border border-gray-600" id="toolGroup">
                    <button onclick="setViewerMode('none')" id="btnToolNone" class="tool-btn tool-active hover:bg-gray-700 p-2 rounded text-xs flex flex-col items-center w-12 transition-colors" title="Navegar (Mouse Normal)"><i class="fas fa-hand-pointer text-sm mb-1"></i>Nav</button>
                    <button onclick="setViewerMode('highlight')" id="btnToolHighlight" class="tool-btn hover:bg-gray-700 p-2 rounded text-xs flex flex-col items-center w-14 transition-colors" title="Resaltador Amarillo"><i class="fas fa-highlighter text-sm mb-1"></i>Resaltar</button>
                    <button onclick="setViewerMode('text')" id="btnToolText" class="tool-btn hover:bg-gray-700 p-2 rounded text-xs flex flex-col items-center w-12 transition-colors" title="Agregar Texto"><i class="fas fa-font text-sm mb-1"></i>Texto</button>
                    <button onclick="setViewerMode('stamp')" id="btnToolStamp" class="tool-btn hover:bg-gray-700 p-2 rounded text-xs flex flex-col items-center w-14 transition-colors" title="Estampar Firma"><i class="fas fa-stamp text-sm mb-1"></i>Firma</button>
                    <button onclick="setViewerMode('ocr')" id="btnToolOcr" class="tool-btn hover:bg-gray-700 p-2 rounded text-xs flex flex-col items-center w-14 transition-colors" title="Seleccionar Área para OCR"><i class="fas fa-expand text-sm mb-1"></i>Leer Área</button>
                </div>
            </div>

            <div class="flex items-center gap-2 md:gap-4 text-gray-300">
                <div class="hidden md:flex items-center bg-gray-800 px-3 py-1 rounded text-xs gap-1">
                    Pg <span id="viewerCurrentPage">1</span> / <span id="viewerTotalPages">1</span>
                </div>
                <div class="h-5 w-px bg-gray-600 hidden md:block"></div>
                <button onclick="viewerZoomOut()" class="hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-minus"></i></button>
                <span id="viewerZoomLabel" class="text-xs font-mono w-10 text-center">100%</span>
                <button onclick="viewerZoomIn()" class="hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-plus"></i></button>
            </div>
        </div>
        <div class="flex flex-1 overflow-hidden">
            <div class="w-24 md:w-48 bg-[#202124] overflow-y-auto flex flex-col items-center py-4 gap-6" id="viewerSidebar"></div>
            <!-- Visor Principal -->
            <div class="flex-1 bg-[#525659] overflow-y-auto flex flex-col items-center p-4 md:p-8 relative gap-6" id="viewerMainArea">
                <!-- Imágenes Inyectadas -->
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[300]">
        <div class="bg-white p-6 rounded-2xl flex flex-col items-center shadow-2xl">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-2"></div>
            <p class="text-xs font-bold mt-2 text-slate-700" id="loaderText">Procesando...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let allPages = []; 
        let cropper = null; 
        let currentEditingPageId = null; 
        let currentZoom = 1;
        let viewerZoom = 1;
        let isModalOpen = false; 
        let viewerObserver = null;
        
        // Estado del Editor Avanzado
        let activeViewerMode = 'none'; // 'none', 'highlight', 'text', 'stamp', 'ocr'
        let savedSignatureImg = null;  // Almacenará la firma (DataURL)

        const pagesGrid = document.getElementById('pagesGrid');
        const loader = document.getElementById('loader');

        new Sortable(pagesGrid, { animation: 150, ghostClass: 'sortable-ghost', delay: 50, delayOnTouchOnly: true });
        document.getElementById('dropzone').onclick = () => document.getElementById('fileInput').click();

        const nameNav = document.getElementById('outputFileName');
        nameNav.addEventListener('blur', (e) => {
            if(e.target.value.trim() === '') {
                nameNav.value = allPages.length > 0 ? allPages[0].originalName : "Documento_Editado";
            }
        });

        window.addEventListener('popstate', () => {
            if (isModalOpen) {
                cancelCrop(); closeFullViewer(); closeSignatureModal();
                isModalOpen = false;
            }
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') history.back(); });

        function dataUriToUint8Array(dataUri) {
            const parts = dataUri.split(',');
            const mime = parts[0].match(/:(.*?);/)[1];
            const bstr = atob(parts[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return { u8arr, mime };
        }

        async function getCompressedData(dataUri, qualityStr) {
            if(dataUri.includes("image/png")) return dataUri;
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', 0.90)); // Compresión estándar final
                };
                img.src = dataUri;
            });
        }

        async function handleFiles(files) {
            if (files.length === 0) return;
            if (allPages.length === 0) nameNav.value = files[0].name.replace(/\.[^/.]+$/, "");
            loader.classList.remove('hidden'); document.getElementById('loaderText').innerText = "Cargando archivos...";
            document.getElementById('editorContainer').classList.remove('hidden');

            for (const file of files) {
                const cleanName = file.name.replace(/\.[^/.]+$/, "");
                if (file.type === "application/pdf") {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({scale: 2.0});
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height; canvas.width = viewport.width;
                        await page.render({canvasContext: context, viewport: viewport}).promise;
                        addPageToGrid(canvas.toDataURL('image/jpeg', 1.0), cleanName);
                    }
                } else if (file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = (e) => addPageToGrid(e.target.result, cleanName);
                    reader.readAsDataURL(file);
                }
            }
            loader.classList.add('hidden');
        }

        function addPageToGrid(displayData, originalName) {
            const pageId = Math.random().toString(36).substr(2, 9);
            // originalCrop guarda la versión intacta (sin filtros ni recortes aplicados)
            allPages.push({ id: pageId, currentData: displayData, originalCrop: displayData, originalName });
            
            const div = document.createElement('div');
            div.className = 'page-card group relative bg-white border border-slate-200 rounded-xl p-2 shadow-sm flex flex-col justify-between';
            div.dataset.id = pageId;
            
            div.innerHTML = `
                <div class="page-number absolute -top-2 -left-2 bg-indigo-600 text-white w-6 h-6 rounded flex items-center justify-center text-[10px] font-bold z-10 border-2 border-white shadow"></div>
                <div class="relative w-full h-32 md:h-40 flex items-center justify-center bg-slate-100 rounded-lg overflow-hidden cursor-pointer" onclick="openPreview('${pageId}')">
                    <img src="${displayData}" class="thumbnail-img object-contain w-full h-full">
                </div>
                <div class="action-btns absolute top-3 right-3 z-20 flex flex-col gap-2">
                    <button onclick="event.stopPropagation(); deletePage('${pageId}')" class="w-8 h-8 bg-rose-600 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-rose-700 transition-colors"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
                <p class="text-[9px] text-slate-500 mt-2 truncate text-center font-semibold px-1">${originalName}</p>
            `;
            pagesGrid.appendChild(div);
        }

        async function buildFinalPDF() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return null;
            const mergedPdf = await PDFLib.PDFDocument.create();
            const margin = parseInt(document.getElementById('pageMargin').value) || 0;
            
            for (const item of items) {
                const pageObj = allPages.find(p => p.id === item.dataset.id);
                const { u8arr, mime } = dataUriToUint8Array(pageObj.currentData);
                const img = mime === "image/png" ? await mergedPdf.embedPng(u8arr) : await mergedPdf.embedJpg(u8arr);
                
                const page = mergedPdf.addPage([img.width + (margin * 2), img.height + (margin * 2)]);
                page.drawImage(img, { x: margin, y: margin, width: img.width, height: img.height });
            }
            return await mergedPdf.save();
        }

        async function exportPDF() {
            const fileName = nameNav.value.trim() || "Documento_Editado";
            loader.classList.remove('hidden'); document.getElementById('loaderText').innerText = "Generando PDF final...";
            try {
                const pdfBytes = await buildFinalPDF();
                if(pdfBytes) downloadBlob(pdfBytes, `${fileName}.pdf`);
            } catch (e) { alert("Error al generar PDF."); }
            loader.classList.add('hidden');
        }

        function downloadBlob(data, name) {
            const blob = new Blob([data], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = name;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ==========================================
        // CROP & FILTER MODAL (Preview)
        // ==========================================
        function openPreview(pageId) {
            const pageObj = allPages.find(p => p.id === pageId);
            currentEditingPageId = pageId; currentZoom = 1;
            document.getElementById('modalImg').src = pageObj.currentData;
            document.getElementById('modalImg').style.transform = `scale(1)`;
            document.getElementById('previewModal').style.display = 'flex';
            history.pushState({ modalOpen: true }, ''); isModalOpen = true;
        }

        function closePreview() { history.back(); }

        // MÁGICO: Aplica un filtro de escaneo (Blanco Puro y Negro) directamente al canvas
        function applyCropFilter(type) {
            const pageObj = allPages.find(p => p.id === currentEditingPageId);
            const img = new Image();
            
            // Si hay un cropper activo, debemos reiniciar la imagen en el cropper, de lo contrario en la vista normal
            const targetImgElement = cropper ? document.getElementById('cropperImg') : document.getElementById('modalImg');
            const baseData = type === 'reset' ? pageObj.originalCrop : pageObj.currentData; // Tomar la base correcta

            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                
                if (type === 'magic') {
                    // Simular Escáner: Escala de grises, alto contraste y extra brillo para blanquear fondos
                    ctx.filter = 'grayscale(100%) contrast(150%) brightness(130%)';
                } else {
                    ctx.filter = 'none';
                }
                
                ctx.drawImage(img, 0, 0);
                const filteredDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                
                if(cropper) {
                    cropper.replace(filteredDataUrl);
                } else {
                    pageObj.currentData = filteredDataUrl; // Guardar estado
                    targetImgElement.src = filteredDataUrl;
                    updateThumbnailAndSidebar(currentEditingPageId, filteredDataUrl);
                }
            };
            img.src = baseData;
        }

        function startCrop() {
            const pageObj = allPages.find(p => p.id === currentEditingPageId);
            document.getElementById('modalImageContainer').style.display = 'none';
            const cropperImg = document.getElementById('cropperImg');
            cropperImg.src = pageObj.currentData; // Recortar sobre el dato actual (puede estar filtrado)
            document.getElementById('cropperContainer').classList.remove('hidden');
            document.getElementById('cropBtn').classList.add('hidden');
            document.getElementById('confirmCropBtn').classList.remove('hidden');
            document.getElementById('cancelCropBtn').classList.remove('hidden');
            cropper = new Cropper(cropperImg, { viewMode: 1, autoCropArea: 1, background: false });
        }
        function confirmCrop() {
            if (!cropper) return;
            const croppedDataUrl = cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' }).toDataURL('image/jpeg', 0.95);
            const pageObj = allPages.find(p => p.id === currentEditingPageId);
            pageObj.currentData = croppedDataUrl;
            pageObj.originalCrop = croppedDataUrl; // Actualizar el original de referencia
            updateThumbnailAndSidebar(currentEditingPageId, croppedDataUrl);
            document.getElementById('modalImg').src = croppedDataUrl;
            cancelCrop();
        }
        function cancelCrop() {
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('cropperContainer').classList.add('hidden');
            document.getElementById('modalImageContainer').style.display = 'flex';
            document.getElementById('cropBtn').classList.remove('hidden');
            document.getElementById('confirmCropBtn').classList.add('hidden');
            document.getElementById('cancelCropBtn').classList.add('hidden');
        }
        function zoomIn() { currentZoom += 0.3; updateZoom(); }
        function zoomOut() { currentZoom = Math.max(0.4, currentZoom - 0.3); updateZoom(); }
        function updateZoom() { document.getElementById('modalImg').style.transform = `scale(${currentZoom})`; }
        function updateThumbnailAndSidebar(pageId, dataUrl) {
            const thumb = document.querySelector(`[data-id="${pageId}"] .thumbnail-img`);
            if(thumb) thumb.src = dataUrl;
            const sidebarThumb = document.getElementById(`sidebar-img-${pageId}`);
            if(sidebarThumb) sidebarThumb.src = dataUrl;
            const viewImg = document.getElementById(`view-img-${pageId}`);
            if(viewImg) viewImg.src = dataUrl;
        }

        // ==========================================
        // FIRMA ELECTRÓNICA (Canvas Pad)
        // ==========================================
        const sigCanvas = document.getElementById('signaturePad');
        const sigCtx = sigCanvas.getContext('2d');
        let isDrawingSig = false;

        // Mouse Events para la Firma
        const getSigPos = (evt) => {
            const rect = sigCanvas.getBoundingClientRect();
            return {
                x: (evt.clientX || (evt.touches && evt.touches[0].clientX)) - rect.left,
                y: (evt.clientY || (evt.touches && evt.touches[0].clientY)) - rect.top
            };
        };
        const startSig = (e) => { e.preventDefault(); isDrawingSig = true; sigCtx.beginPath(); sigCtx.moveTo(getSigPos(e).x, getSigPos(e).y); };
        const drawSig = (e) => {
            if (!isDrawingSig) return; e.preventDefault();
            sigCtx.lineTo(getSigPos(e).x, getSigPos(e).y);
            sigCtx.lineWidth = 3; sigCtx.strokeStyle = '#0f172a'; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
            sigCtx.stroke();
        };
        const stopSig = (e) => { e.preventDefault(); isDrawingSig = false; sigCtx.closePath(); };

        sigCanvas.addEventListener('mousedown', startSig); sigCanvas.addEventListener('mousemove', drawSig); sigCanvas.addEventListener('mouseup', stopSig); sigCanvas.addEventListener('mouseleave', stopSig);
        sigCanvas.addEventListener('touchstart', startSig, {passive: false}); sigCanvas.addEventListener('touchmove', drawSig, {passive: false}); sigCanvas.addEventListener('touchend', stopSig);

        function clearSignature() { sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); savedSignatureImg = null; }
        
        function uploadSignatureImage(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = () => { clearSignature(); sigCtx.drawImage(img, 0, 0, sigCanvas.width, sigCanvas.height); };
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        function saveSignature() {
            // Verificar que no esté vacío (rudimentario)
            const blank = document.createElement('canvas'); blank.width = sigCanvas.width; blank.height = sigCanvas.height;
            if(sigCanvas.toDataURL() === blank.toDataURL()) return alert("El lienzo está vacío. Dibuja o sube una firma.");
            
            savedSignatureImg = sigCanvas.toDataURL('image/png'); // Guardar con transparencia
            closeSignatureModal();
            // Al guardar, automáticamente activamos el modo estampar en el visor
            setViewerMode('stamp');
        }

        function openSignatureModal() { document.getElementById('signatureModal').classList.remove('hidden'); }
        function closeSignatureModal() { document.getElementById('signatureModal').classList.add('hidden'); }


        // ==========================================
        // VISOR AVANZADO (Herramientas, Eventos y OCR)
        // ==========================================
        function openFullViewer() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return;
            
            const sidebar = document.getElementById('viewerSidebar');
            const mainArea = document.getElementById('viewerMainArea');
            sidebar.innerHTML = ''; mainArea.innerHTML = '';
            viewerZoom = 1; 
            
            document.getElementById('viewerTotalPages').innerText = items.length;

            items.forEach((item, index) => {
                const pageObj = allPages.find(p => p.id === item.dataset.id);
                
                // Sidebar Thumb
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'w-16 h-20 md:w-36 md:h-44 bg-white flex items-center justify-center cursor-pointer border border-transparent transition-all shadow-md relative thumb-sidebar-item';
                thumbDiv.id = `sidebar-thumb-${pageObj.id}`;
                thumbDiv.onclick = () => { document.getElementById(`view-container-${pageObj.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' }); };
                thumbDiv.innerHTML = `<img id="sidebar-img-${pageObj.id}" src="${pageObj.currentData}" class="object-contain w-full h-full p-1"><div class="absolute -bottom-5 text-gray-400 text-[10px] md:text-xs text-center w-full">${index + 1}</div>`;
                sidebar.appendChild(thumbDiv);

                // Contenedor Principal (Wrapper) -> Imagen base -> Canvas superpuesto interactivo
                const imgContainer = document.createElement('div');
                imgContainer.className = "page-container flex flex-col items-center shadow-2xl relative bg-white";
                imgContainer.id = `view-container-${pageObj.id}`;
                imgContainer.dataset.index = index + 1;
                imgContainer.dataset.id = pageObj.id;
                imgContainer.style.width = '100%';
                imgContainer.style.maxWidth = '800px'; 
                
                imgContainer.innerHTML = `
                    <img src="${pageObj.currentData}" id="view-img-${pageObj.id}" class="viewer-img w-full h-auto block select-none pointer-events-none">
                    <canvas id="canvas-${pageObj.id}" class="absolute top-0 left-0 w-full h-full cursor-pointer touch-none"></canvas>
                `;
                mainArea.appendChild(imgContainer);
            });
            
            updateViewerZoom(); setupViewerObserver();
            document.getElementById('fullViewerModal').classList.remove('hidden');
            
            // Forzar inicialización de canvas luego del renderizado
            setTimeout(() => {
                document.querySelectorAll('.page-container canvas').forEach(c => initializeViewerCanvas(c));
                setViewerMode('none'); 
            }, 100);

            history.pushState({ modalOpen: true }, ''); isModalOpen = true;
        }

        // --- Gestión de Modos ---
        function setViewerMode(mode) {
            activeViewerMode = mode;
            // Actualizar UI de botones
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('tool-active'));
            const activeBtn = document.querySelector(`#toolGroup button[onclick="setViewerMode('${mode}')"]`);
            if(activeBtn) activeBtn.classList.add('tool-active');

            // Si es 'stamp' pero no hay firma, pedir crearla
            if(mode === 'stamp' && !savedSignatureImg) {
                openSignatureModal();
                setViewerMode('none'); // Revertir temporalmente hasta que guarde
                return;
            }

            // Actualizar cursores en los canvas
            document.querySelectorAll('.page-container canvas').forEach(c => {
                c.classList.remove('cursor-ocr', 'cursor-draw', 'cursor-text', 'cursor-stamp', 'cursor-pointer');
                if(mode === 'ocr') c.classList.add('cursor-ocr');
                else if(mode === 'highlight') c.classList.add('cursor-draw');
                else if(mode === 'text') c.classList.add('cursor-text');
                else if(mode === 'stamp') c.classList.add('cursor-stamp');
                else c.classList.add('cursor-pointer'); // 'none'
            });
        }

        // --- Lógica Principal de Interacción en Visor Avanzado ---
        function initializeViewerCanvas(canvas) {
            const img = canvas.previousElementSibling;
            const pageId = canvas.parentElement.dataset.id;
            
            // Match canvas size to natural image size to keep aspect ratio correct for drawing/saving
            canvas.width = img.naturalWidth || 800;
            canvas.height = img.naturalHeight || 1131;
            const ctx = canvas.getContext('2d');
            
            let isDragging = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let snapshot = null; // Para guardar estado al dibujar rectángulos

            const getEventCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const onDown = (e) => {
                if(activeViewerMode === 'none') return;
                e.preventDefault(); // Evitar scroll al interactuar en móvil
                const pos = getEventCoords(e);
                startX = pos.x; startY = pos.y;
                isDragging = true;
                
                if(activeViewerMode === 'highlight') {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                }
                else if(activeViewerMode === 'ocr') {
                    // Guardar snapshot para limpiar el rectángulo visual al mover
                    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }
                else if(activeViewerMode === 'text') {
                    isDragging = false; // El texto es solo clic
                    const text = prompt("Ingresa el texto a insertar:");
                    if(text && text.trim().length > 0) {
                        ctx.font = `bold ${Math.floor(canvas.width / 40)}px sans-serif`;
                        ctx.fillStyle = "black";
                        ctx.fillText(text, startX, startY);
                        bakeCanvasToImage(canvas, pageId);
                    }
                }
                else if(activeViewerMode === 'stamp' && savedSignatureImg) {
                    isDragging = false;
                    const sig = new Image();
                    sig.onload = () => {
                        // Dibujar firma redimensionada proporcionalmente
                        const stampWidth = canvas.width * 0.3; // 30% del ancho de página
                        const stampHeight = (sig.height / sig.width) * stampWidth;
                        // Centrar el clic
                        ctx.drawImage(sig, startX - (stampWidth/2), startY - (stampHeight/2), stampWidth, stampHeight);
                        bakeCanvasToImage(canvas, pageId);
                    };
                    sig.src = savedSignatureImg;
                }
            };

            const onMove = (e) => {
                if(!isDragging) return;
                const pos = getEventCoords(e);
                currentX = pos.x; currentY = pos.y;
                
                if(activeViewerMode === 'highlight') {
                    ctx.lineTo(currentX, currentY);
                    ctx.lineWidth = canvas.width / 60; // Grueso adaptable
                    ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)'; // Amarillo transparente
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.stroke();
                }
                else if(activeViewerMode === 'ocr') {
                    // Restaurar y dibujar rectángulo
                    ctx.putImageData(snapshot, 0, 0);
                    ctx.beginPath();
                    ctx.rect(startX, startY, currentX - startX, currentY - startY);
                    ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 4;
                    ctx.fillStyle = 'rgba(79, 70, 229, 0.2)';
                    ctx.fill(); ctx.stroke();
                }
            };

            const onUp = (e) => {
                if(!isDragging) return;
                isDragging = false;
                
                if(activeViewerMode === 'highlight') {
                    bakeCanvasToImage(canvas, pageId);
                }
                else if(activeViewerMode === 'ocr') {
                    // Restaurar canvas limpio (sin el cuadro azul)
                    ctx.putImageData(snapshot, 0, 0);
                    
                    const width = Math.abs(currentX - startX);
                    const height = Math.abs(currentY - startY);
                    const sx = Math.min(startX, currentX);
                    const sy = Math.min(startY, currentY);
                    
                    if(width > 20 && height > 20) {
                        executeAreaOCR(canvas.previousElementSibling, sx, sy, width, height);
                    }
                    // Desactivar OCR después de un uso para evitar accidentes
                    setViewerMode('none');
                }
            };

            canvas.addEventListener('mousedown', onDown); canvas.addEventListener('mousemove', onMove);
            canvas.addEventListener('mouseup', onUp); canvas.addEventListener('mouseleave', () => { if(isDragging) onUp(); });
            canvas.addEventListener('touchstart', onDown, {passive: false}); canvas.addEventListener('touchmove', onMove, {passive: false});
            canvas.addEventListener('touchend', onUp);
        }

        // Combina el fondo de la imagen actual con las pinceladas/sellos del canvas interactivo
        function bakeCanvasToImage(canvas, pageId) {
            const pageObj = allPages.find(p => p.id === pageId);
            const img = canvas.previousElementSibling;
            
            const mergeCanvas = document.createElement('canvas');
            mergeCanvas.width = canvas.width; mergeCanvas.height = canvas.height;
            const mCtx = mergeCanvas.getContext('2d');
            
            const baseImg = new Image();
            baseImg.onload = () => {
                mCtx.drawImage(baseImg, 0, 0, mergeCanvas.width, mergeCanvas.height);
                mCtx.drawImage(canvas, 0, 0);
                const newData = mergeCanvas.toDataURL('image/jpeg', 0.95);
                
                pageObj.currentData = newData; // Actualizar datos
                updateThumbnailAndSidebar(pageId, newData); // Actualizar UI
                
                // Limpiar canvas superpuesto ya que el cambio se fusionó en el <img> de fondo
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            };
            baseImg.src = pageObj.currentData;
        }

        // Ejecuta OCR sobre un fragmento específico de la imagen principal
        async function executeAreaOCR(imageElement, x, y, w, h) {
            loader.classList.remove('hidden'); 
            document.getElementById('loaderText').innerText = "Analizando texto (OCR)...";
            
            // Recortar en memoria
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = w; cropCanvas.height = h;
            cropCanvas.getContext('2d').drawImage(imageElement, x, y, w, h, 0, 0, w, h);
            const croppedBase64 = cropCanvas.toDataURL('image/jpeg');

            try {
                const result = await Tesseract.recognize(croppedBase64, 'spa', { logger: m => console.log(m) });
                loader.classList.add('hidden');
                
                const texto = result.data.text.trim();
                if(texto.length > 0) {
                    document.getElementById('ocrTextArea').value = texto;
                    document.getElementById('ocrResultModal').classList.remove('hidden');
                } else {
                    alert("No se detectó texto claro en el área seleccionada.");
                }
            } catch(e) {
                loader.classList.add('hidden');
                alert("Ocurrió un error al procesar el OCR.");
                console.error(e);
            }
        }
        
        function copyOCRText() {
            const text = document.getElementById('ocrTextArea');
            text.select();
            document.execCommand('copy');
            alert("Texto copiado al portapapeles.");
        }

        // Observer para panel lateral (Scroll Tracker)
        function setupViewerObserver() {
            if(viewerObserver) viewerObserver.disconnect();
            const options = { root: document.getElementById('viewerMainArea'), rootMargin: '0px', threshold: 0.3 };
            
            viewerObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageId = entry.target.dataset.id;
                        document.querySelectorAll('.thumb-sidebar-item').forEach(el => el.classList.remove('thumb-active'));
                        const activeThumb = document.getElementById(`sidebar-thumb-${pageId}`);
                        if(activeThumb) activeThumb.classList.add('thumb-active');
                        document.getElementById('viewerCurrentPage').innerText = entry.target.dataset.index;
                    }
                });
            }, options);
            
            document.querySelectorAll('.page-container').forEach(container => viewerObserver.observe(container));
        }

        function viewerZoomIn() { viewerZoom += 0.25; updateViewerZoom(); }
        function viewerZoomOut() { viewerZoom = Math.max(0.25, viewerZoom - 0.25); updateViewerZoom(); }
        function updateViewerZoom() {
            const pct = Math.round(viewerZoom * 100);
            document.querySelectorAll('.page-container').forEach(wrapper => { wrapper.style.width = `${pct}%`; });
            document.getElementById('viewerZoomLabel').innerText = `${pct}%`;
        }

        function closeFullViewer() { history.back(); }
        function deletePage(id) { document.querySelector(`[data-id="${id}"]`).remove(); allPages = allPages.filter(p => p.id !== id); }
        function clearAll() { if(confirm("¿Borrar todos los documentos?")) { location.reload(); } }
    </script>
</body>
