<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Pro | Adrian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .page-card .action-btns { opacity: 1; }
        @media (min-width: 768px) {
            .page-card .action-btns { opacity: 0; }
            .page-card:hover .action-btns { opacity: 1; }
        }
        .sortable-ghost { opacity: 0.1; transform: scale(0.95); background: #6366f1; }
        #previewModal { display: none; }
        #modalImageContainer { display: flex; justify-content: center; overflow: auto; width: 100%; max-height: 70vh; background: #0f172a; border-radius: 12px; }
        #modalImg { transform-origin: top center; transition: transform 0.1s; max-width: 100%; }
        #pagesGrid { counter-reset: pdf-counter; }
        .page-number::before { counter-increment: pdf-counter; content: counter(pdf-counter); }
        .mode-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .mode-active { border-color: #6366f1 !important; background-color: #f5f7ff !important; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1); transform: translateY(-2px); }
        .mode-active .check-icon { display: flex !important; }
        
        /* Estilos del visor Chrome-like */
        #viewerMainArea::-webkit-scrollbar, #viewerSidebar::-webkit-scrollbar { width: 8px; height: 8px; }
        #viewerMainArea::-webkit-scrollbar-thumb, #viewerSidebar::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }
        #viewerMainArea::-webkit-scrollbar-track, #viewerSidebar::-webkit-scrollbar-track { background: transparent; }
        .thumb-active { border: 2px solid #8ab4f8 !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <nav class="bg-white border-b border-slate-200 px-3 md:px-6 py-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 shrink-0">
                <div class="bg-indigo-600 p-1.5 rounded-lg text-white"><i class="fas fa-magic text-lg"></i></div>
                <h1 class="text-sm md:text-xl font-bold tracking-tight text-slate-800 hidden sm:block">PDF Editor <span class="text-indigo-600">Pro</span></h1>
            </div>
            
            <div class="flex items-center gap-2 flex-1 justify-end">
                <input type="text" id="outputFileName" placeholder="Nombre (Opcional)" class="px-2 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none w-32 md:w-48 transition-all">
                <button onclick="printEditedPDF()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-bold text-xs md:text-sm shadow-sm transition-all shrink-0">
                    <i class="fas fa-print"></i>
                </button>
                <button id="navSaveBtn" onclick="exportPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 md:px-5 py-2 rounded-lg font-bold text-xs md:text-sm shadow-md transition-all shrink-0">
                    Guardar PDF
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 md:px-6 py-6 md:py-10">
        
        <section class="mb-6 md:mb-8 bg-white p-5 md:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
            <!-- Bloque 1: Dimensiones y Márgenes -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Formato de Salida</h2>
                    <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <select id="pageSize" onchange="toggleManualSize()" class="bg-transparent text-sm font-bold px-2 py-1 outline-none text-indigo-600 w-full">
                            <option value="original">Original</option>
                            <option value="letter">Carta</option>
                            <option value="legal">Oficio</option>
                            <option value="manual">Personalizado</option>
                        </select>
                        <div id="manualInputs" class="hidden flex items-center gap-1 border-l border-slate-300 pl-2">
                            <input type="number" id="manualW" placeholder="W" class="w-12 text-[10px] p-1.5 border rounded">
                            <input type="number" id="manualH" placeholder="H" class="w-12 text-[10px] p-1.5 border rounded">
                        </div>
                    </div>
                </div>
                <div>
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Márgenes Globales</h2>
                    <select id="pageMargin" class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm font-bold text-indigo-600 outline-none w-full">
                        <option value="0">Sin margen</option>
                        <option value="20">Normal (20px)</option>
                        <option value="40">Ancho (40px)</option>
                    </select>
                </div>
            </div>
            
            <!-- Bloque 2: Nuevas Configuraciones (Calidad y Marca de agua) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-100">
                <div>
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Calidad (Compresión)</h2>
                    <div class="flex items-center gap-3">
                        <input type="range" id="qualitySlider" min="0.1" max="1.0" step="0.1" value="0.9" class="w-full accent-indigo-600" oninput="document.getElementById('qualityLabel').innerText = Math.round(this.value * 100) + '%'">
                        <span id="qualityLabel" class="text-xs font-bold text-slate-500 w-10">90%</span>
                    </div>
                </div>
                <div>
                    <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Marca de Agua (Opcional)</h2>
                    <input type="text" id="watermarkInput" placeholder="Ej: CONFIDENCIAL" class="w-full bg-slate-50 p-2 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
            </div>
        </section>

        <div id="dropzone" class="bg-white border-2 border-dashed border-indigo-200 rounded-2xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all mb-6 md:mb-8 group shadow-sm">
            <input type="file" id="fileInput" multiple accept=".pdf,image/*" class="hidden" onchange="handleFiles(this.files)">
            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-plus text-indigo-600 text-lg"></i></div>
            <h3 class="text-sm md:text-lg font-bold text-slate-700">Añadir archivos (PDF o Imágenes)</h3>
        </div>

        <div id="modeSelector" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <button onclick="setAppMode('merge')" id="btnModeMerge" class="mode-card p-5 bg-white border border-slate-200 rounded-2xl text-left shadow-sm relative group">
                <div class="check-icon hidden absolute top-2 right-2 w-5 h-5 bg-indigo-600 text-white rounded-full items-center justify-center text-[10px]"><i class="fas fa-check"></i></div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600"><i class="fas fa-layer-group"></i></div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">Unir todo</h4>
                        <p class="text-[10px] text-slate-400">Un solo documento final.</p>
                    </div>
                </div>
            </button>
            <button onclick="setAppMode('split')" id="btnModeSplit" class="mode-card p-5 bg-white border border-slate-200 rounded-2xl text-left shadow-sm relative group">
                <div class="check-icon hidden absolute top-2 right-2 w-5 h-5 bg-indigo-600 text-white rounded-full items-center justify-center text-[10px]"><i class="fas fa-check"></i></div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600"><i class="fas fa-columns"></i></div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">Separar grupos</h4>
                        <p class="text-[10px] text-slate-400">Varios PDFs numerados.</p>
                    </div>
                </div>
            </button>
        </div>

        <div id="editorContainer" class="hidden border-t border-slate-200 pt-6">
            
            <div id="splitOptions" class="hidden bg-white p-5 rounded-2xl border border-indigo-200 shadow-md mb-8 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Nombre base</label>
                        <input type="text" id="outputFileNameEditor" placeholder="Ej: Factura" class="px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex flex-col gap-1 md:col-span-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Enumeración (#)</label>
                        <div class="flex gap-2">
                            <input type="text" id="enumFormat" value="-pg #" class="px-3 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500 flex-1">
                            <select id="enumPosition" class="bg-slate-50 border border-slate-300 rounded-lg text-xs px-2 font-bold outline-none">
                                <option value="end">Final</option>
                                <option value="start">Inicio</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col md:flex-row items-center justify-between pt-4 border-t border-slate-100 gap-3">
                    <p class="text-[10px] text-slate-400 italic">Ejemplo: <span id="nameExample" class="font-bold text-indigo-500">...</span></p>
                    <button onclick="splitByRange()" class="w-full md:w-auto bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg">Descargar Grupos</button>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-tight">Ordena y Edita</h2>
                <div class="flex gap-2">
                    <button onclick="openFullViewer()" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2"><i class="fas fa-desktop"></i> Visor Chrome</button>
                    <button onclick="clearAll()" class="text-rose-600 text-xs font-bold border border-rose-200 px-4 py-2 rounded-lg">Limpiar Todo</button>
                </div>
            </div>
            
            <div id="pagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 mb-20"></div>
        </div>
    </main>

    <!-- Modal Recorte Individual (Anterior) -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/98 z-[100] p-4 flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="w-full max-w-5xl flex justify-between items-center mb-4 text-white">
            <div class="flex gap-2">
                <button onclick="zoomIn()" class="bg-slate-800 p-2 rounded-lg"><i class="fas fa-search-plus"></i></button>
                <button onclick="zoomOut()" class="bg-slate-800 p-2 rounded-lg"><i class="fas fa-search-minus"></i></button>
                <button onclick="startCrop()" id="cropBtn" class="bg-indigo-600 px-4 py-2 rounded-lg text-xs font-bold">Recortar</button>
                <button onclick="confirmCrop()" id="confirmCropBtn" class="bg-emerald-600 px-4 py-2 rounded-lg text-xs font-bold hidden">OK</button>
                <button onclick="cancelCrop()" id="cancelCropBtn" class="bg-rose-600 px-4 py-2 rounded-lg text-xs font-bold hidden">X</button>
            </div>
            <button onclick="closePreview()" class="text-white text-3xl">&times;</button>
        </div>
        <div id="modalImageContainer"><img id="modalImg" src=""></div>
        <div id="cropperContainer" class="rounded-xl overflow-hidden hidden"><img id="cropperImg" src=""></div>
    </div>

    <!-- NUEVO: Modal Visor Estilo Chrome -->
    <div id="fullViewerModal" class="hidden fixed inset-0 bg-[#323639] z-[150] flex flex-col">
        <!-- Topbar -->
        <div class="h-14 bg-[#323639] border-b border-gray-600 flex justify-between items-center px-4 text-white select-none">
            <div class="flex items-center gap-4">
                <button onclick="closeFullViewer()" class="text-gray-300 hover:text-white hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-arrow-left"></i></button>
                <span id="viewerTitle" class="text-sm font-semibold truncate max-w-[200px] md:max-w-md text-gray-200"></span>
            </div>
            <div class="flex items-center gap-2 md:gap-4 text-gray-300">
                <div class="hidden md:flex items-center bg-gray-800 px-3 py-1 rounded text-xs gap-1">
                    <span id="viewerCurrentPage">1</span> / <span id="viewerTotalPages">1</span>
                </div>
                <div class="h-5 w-px bg-gray-600 hidden md:block"></div>
                <button onclick="viewerZoomOut()" class="hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-minus"></i></button>
                <span id="viewerZoomLabel" class="text-xs font-mono w-10 text-center">100%</span>
                <button onclick="viewerZoomIn()" class="hover:bg-gray-700 p-2 rounded-full transition"><i class="fas fa-plus"></i></button>
                <div class="h-5 w-px bg-gray-600"></div>
                <button onclick="printEditedPDF()" class="hover:bg-gray-700 p-2 rounded-full transition" title="Imprimir"><i class="fas fa-print"></i></button>
                <button onclick="exportPDF()" class="hover:bg-gray-700 p-2 rounded-full transition" title="Descargar"><i class="fas fa-download"></i></button>
            </div>
        </div>
        <!-- Contenido Visor -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar (Miniaturas) -->
            <div class="w-24 md:w-56 bg-[#202124] overflow-y-auto flex flex-col items-center py-4 gap-6" id="viewerSidebar"></div>
            <!-- Area Principal -->
            <div class="flex-1 bg-[#525659] overflow-auto flex justify-center items-start p-4 md:p-8 relative" id="viewerMainArea">
                <img id="viewerMainImg" src="" class="shadow-2xl transition-transform ease-out duration-100 origin-top" style="max-width: 100%; width: auto;">
            </div>
        </div>
    </div>

    <!-- Iframe invisible para impresiones -->
    <iframe id="printFrame" class="hidden"></iframe>

    <div id="loader" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[200]">
        <div class="bg-white p-6 rounded-2xl flex flex-col items-center shadow-2xl">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-2"></div>
            <p class="text-xs font-bold mt-2 text-slate-700" id="loaderText">Procesando...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let allPages = []; let cropper = null; let currentEditingPageId = null; let currentZoom = 1;
        let viewerZoom = 1; let currentMode = 'merge';

        const pagesGrid = document.getElementById('pagesGrid');
        const loader = document.getElementById('loader');

        new Sortable(pagesGrid, { animation: 150, ghostClass: 'sortable-ghost', delay: 50, delayOnTouchOnly: true });
        document.getElementById('dropzone').onclick = () => document.getElementById('fileInput').click();

        function dataUriToUint8Array(dataUri) {
            const parts = dataUri.split(',');
            const mime = parts[0].match(/:(.*?);/)[1];
            const bstr = atob(parts[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return { u8arr, mime };
        }

        // --- Compresión de Imágenes en tiempo real ---
        async function getCompressedData(dataUri, qualityStr) {
            const quality = parseFloat(qualityStr);
            if (quality >= 0.95 || dataUri.includes("image/png")) return dataUri;
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = dataUri;
            });
        }

        // --- Rotación Permanente vía Canvas ---
        function rotatePageImage(event, pageId) {
            event.stopPropagation();
            const pageObj = allPages.find(p => p.id === pageId);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.height; canvas.height = img.width; // Intercambiar W/H
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.rotate(90 * Math.PI / 180);
                ctx.drawImage(img, -img.width/2, -img.height/2);
                const newData = canvas.toDataURL('image/jpeg', 0.95);
                
                pageObj.currentData = newData;
                pageObj.originalCrop = newData; // Para resetear recortes
                document.querySelector(`[data-id="${pageId}"] .thumbnail-img`).src = newData;
                
                // Si el visor está abierto, actualizarlo
                if(!document.getElementById('fullViewerModal').classList.contains('hidden') && currentEditingPageId === pageId) {
                    document.getElementById('viewerMainImg').src = newData;
                    document.getElementById(`thumb-${pageId}`).src = newData;
                }
            };
            img.src = pageObj.currentData;
        }

        function setAppMode(mode) {
            currentMode = mode;
            const splitOptions = document.getElementById('splitOptions');
            const navSaveBtn = document.getElementById('navSaveBtn');
            const navNameInput = document.getElementById('outputFileName');
            const btnMerge = document.getElementById('btnModeMerge');
            const btnSplit = document.getElementById('btnModeSplit');

            if (mode === 'split') {
                splitOptions.classList.remove('hidden');
                navSaveBtn.classList.add('hidden');
                navNameInput.classList.add('hidden');
                btnSplit.classList.add('mode-active');
                btnMerge.classList.remove('mode-active');
            } else {
                splitOptions.classList.add('hidden');
                navSaveBtn.classList.remove('hidden');
                navNameInput.classList.remove('hidden');
                btnMerge.classList.add('mode-active');
                btnSplit.classList.remove('mode-active');
            }
            updateExample();
        }

        const nameNav = document.getElementById('outputFileName');
        const nameEditor = document.getElementById('outputFileNameEditor');
        [nameNav, nameEditor].forEach(input => {
            input.addEventListener('input', (e) => {
                nameNav.value = e.target.value;
                nameEditor.value = e.target.value;
                updateExample();
            });
        });

        const inputsForExample = ['outputFileNameEditor', 'enumFormat', 'enumPosition'];
        inputsForExample.forEach(id => document.getElementById(id).addEventListener('input', updateExample));

        function updateExample() {
            const name = nameEditor.value || "Documento";
            const pattern = document.getElementById('enumFormat').value || "#";
            const pos = document.getElementById('enumPosition').value;
            const formatted = pattern.replace('#', '1');
            document.getElementById('nameExample').innerText = pos === 'end' ? `${name}${formatted}.pdf` : `${formatted}${name}.pdf`;
        }

        function toggleManualSize() {
            const val = document.getElementById('pageSize').value;
            document.getElementById('manualInputs').classList.toggle('hidden', val !== 'manual');
        }

        async function handleFiles(files) {
            if (files.length === 0) return;
            loader.classList.remove('hidden'); document.getElementById('loaderText').innerText = "Cargando archivos...";
            document.getElementById('modeSelector').classList.remove('hidden');
            document.getElementById('editorContainer').classList.remove('hidden');
            setAppMode('merge'); 

            for (const file of files) {
                const cleanName = file.name.replace(/\.[^/.]+$/, "");
                if (file.type === "application/pdf") {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({scale: 2.0});
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height; canvas.width = viewport.width;
                        await page.render({canvasContext: context, viewport: viewport}).promise;
                        addPageToGrid(arrayBuffer, i - 1, canvas.toDataURL('image/jpeg', 0.95), "pdf", cleanName);
                    }
                } else if (file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = (e) => addPageToGrid(e.target.result, 0, e.target.result, "image", cleanName);
                    reader.readAsDataURL(file);
                }
            }
            loader.classList.add('hidden');
        }

        function addPageToGrid(originalData, originalIndex, displayData, type, originalName) {
            const pageId = Math.random().toString(36).substr(2, 9);
            allPages.push({ id: pageId, originalData, originalIndex, currentData: displayData, originalCrop: displayData, type, originalName });
            const div = document.createElement('div');
            div.className = 'page-card group relative bg-white border border-slate-200 rounded-xl p-2 shadow-sm flex flex-col justify-between';
            div.dataset.id = pageId;
            div.innerHTML = `
                <div class="page-number absolute -top-2 -left-2 bg-indigo-600 text-white w-6 h-6 rounded flex items-center justify-center text-[10px] font-bold z-10 border-2 border-white shadow"></div>
                <div class="relative w-full h-32 md:h-40 flex items-center justify-center bg-slate-100 rounded-lg overflow-hidden cursor-pointer" onclick="openPreview('${pageId}')">
                    <img src="${displayData}" class="thumbnail-img object-contain w-full h-full">
                </div>
                <div class="action-btns absolute top-1 right-1 z-20 flex flex-col gap-1">
                    <button onclick="rotatePageImage(event, '${pageId}')" class="w-8 h-8 bg-white text-indigo-500 rounded-full shadow-md flex items-center justify-center border border-slate-100 hover:bg-indigo-50"><i class="fas fa-undo-alt text-xs"></i></button>
                    <button onclick="event.stopPropagation(); deletePage('${pageId}')" class="w-8 h-8 bg-white text-rose-500 rounded-full shadow-md flex items-center justify-center border border-slate-100 hover:bg-rose-50"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
                <p class="text-[9px] text-slate-500 mt-2 truncate text-center font-semibold px-1">${originalName}</p>
            `;
            pagesGrid.appendChild(div);
        }

        // --- Lógica del Generador Común (Reutilizable para Guardar e Imprimir) ---
        async function buildFinalPDF() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return null;
            
            const mergedPdf = await PDFLib.PDFDocument.create();
            const selection = document.getElementById('pageSize').value;
            const margin = parseInt(document.getElementById('pageMargin').value) || 0;
            const qualitySetting = document.getElementById('qualitySlider').value;
            const watermark = document.getElementById('watermarkInput').value.trim();
            
            let targetSize = null;
            if(selection === 'letter') targetSize = [612, 792];
            else if(selection === 'legal') targetSize = [612, 1008];
            else if(selection === 'manual') {
                const wVal = parseFloat(document.getElementById('manualW').value);
                const hVal = parseFloat(document.getElementById('manualH').value);
                if(wVal > 0 && hVal > 0) targetSize = [wVal * 2.83465, hVal * 2.83465];
            }

            for (const item of items) {
                const pageObj = allPages.find(p => p.id === item.dataset.id);
                const compressedData = await getCompressedData(pageObj.currentData, qualitySetting);
                const { u8arr, mime } = dataUriToUint8Array(compressedData);
                const img = mime === "image/png" ? await mergedPdf.embedPng(u8arr) : await mergedPdf.embedJpg(u8arr);
                
                let page;
                if (!targetSize) {
                    page = mergedPdf.addPage([img.width + (margin * 2), img.height + (margin * 2)]);
                    page.drawImage(img, { x: margin, y: margin, width: img.width, height: img.height });
                } else {
                    page = mergedPdf.addPage(targetSize);
                    const availableWidth = targetSize[0] - (margin * 2);
                    const availableHeight = targetSize[1] - (margin * 2);
                    const scale = Math.min(availableWidth / img.width, availableHeight / img.height);
                    const dWidth = img.width * scale; 
                    const dHeight = img.height * scale;
                    page.drawImage(img, { x: (targetSize[0] - dWidth) / 2, y: (targetSize[1] - dHeight) / 2, width: dWidth, height: dHeight });
                }

                if(watermark) {
                    const { width, height } = page.getSize();
                    page.drawText(watermark, {
                        x: width / 4, y: height / 2,
                        size: 45, opacity: 0.25, rotate: PDFLib.degrees(45), color: PDFLib.rgb(0.5, 0.5, 0.5)
                    });
                }
            }
            return await mergedPdf.save();
        }

        async function printEditedPDF() {
            if (pagesGrid.children.length === 0) return;
            loader.classList.remove('hidden'); document.getElementById('loaderText').innerText = "Preparando impresión...";
            try {
                const pdfBytes = await buildFinalPDF();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                const iframe = document.getElementById('printFrame');
                iframe.src = blobUrl;
                iframe.onload = () => { iframe.contentWindow.print(); };
            } catch (e) { alert("Error al preparar impresión."); }
            loader.classList.add('hidden');
        }

        async function exportPDF() {
            const fileName = nameNav.value.trim() || "Documento_Editado";
            loader.classList.remove('hidden'); document.getElementById('loaderText').innerText = "Generando PDF final...";
            try {
                const pdfBytes = await buildFinalPDF();
                if(pdfBytes) downloadBlob(pdfBytes, `${fileName}.pdf`);
            } catch (e) { console.error(e); alert("Ocurrió un error. Verifica dimensiones personalizadas o archivos."); }
            loader.classList.add('hidden');
        }

        async function splitByRange() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return;
            const size = parseInt(prompt("¿Cada cuántas páginas quieres separar los PDFs?", "1"));
            if (isNaN(size) || size <= 0) return;
            
            const baseName = nameEditor.value.trim() || "Documento_Grupo";
            const enumPattern = document.getElementById('enumFormat').value || "#";
            const enumPos = document.getElementById('enumPosition').value;
            const margin = parseInt(document.getElementById('pageMargin').value) || 0;
            const qualitySetting = document.getElementById('qualitySlider').value;
            const watermark = document.getElementById('watermarkInput').value.trim();
            
            loader.classList.remove('hidden'); document.getElementById('loaderText').innerText = "Empaquetando grupos...";
            try {
                for (let i = 0; i < items.length; i += size) {
                    const chunk = items.slice(i, i + size);
                    const subPdf = await PDFLib.PDFDocument.create();
                    
                    for (const item of chunk) {
                        const pageObj = allPages.find(p => p.id === item.dataset.id);
                        const compressedData = await getCompressedData(pageObj.currentData, qualitySetting);
                        const { u8arr, mime } = dataUriToUint8Array(compressedData);
                        const img = mime === "image/png" ? await subPdf.embedPng(u8arr) : await subPdf.embedJpg(u8arr);
                        const page = subPdf.addPage([img.width + (margin * 2), img.height + (margin * 2)]);
                        page.drawImage(img, { x: margin, y: margin, width: img.width, height: img.height });
                        
                        if(watermark) {
                            page.drawText(watermark, {
                                x: page.getSize().width / 4, y: page.getSize().height / 2,
                                size: 45, opacity: 0.25, rotate: PDFLib.degrees(45), color: PDFLib.rgb(0.5, 0.5, 0.5)
                            });
                        }
                    }
                    const partNum = (i/size) + 1;
                    const formattedEnum = enumPattern.replace('#', partNum);
                    downloadBlob(await subPdf.save(), enumPos === 'end' ? `${baseName}${formattedEnum}.pdf` : `${formattedEnum}${baseName}.pdf`);
                }
            } catch (error) { alert("Error al procesar la división."); }
            loader.classList.add('hidden');
        }

        function downloadBlob(data, name) {
            const blob = new Blob([data], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // --- Lógica Modal Recorte Básico ---
        function openPreview(pageId) {
            const pageObj = allPages.find(p => p.id === pageId);
            currentEditingPageId = pageId; currentZoom = 1;
            document.getElementById('modalImg').src = pageObj.currentData;
            document.getElementById('modalImg').style.transform = `scale(1)`;
            document.getElementById('previewModal').style.display = 'flex';
        }
        function startCrop() {
            const pageObj = allPages.find(p => p.id === currentEditingPageId);
            document.getElementById('modalImageContainer').style.display = 'none';
            const cropperImg = document.getElementById('cropperImg');
            cropperImg.src = pageObj.originalCrop;
            document.getElementById('cropperContainer').classList.remove('hidden');
            document.getElementById('cropBtn').classList.add('hidden');
            document.getElementById('confirmCropBtn').classList.remove('hidden');
            document.getElementById('cancelCropBtn').classList.remove('hidden');
            cropper = new Cropper(cropperImg, { viewMode: 1, autoCropArea: 1 });
        }
        function confirmCrop() {
            if (!cropper) return;
            const croppedDataUrl = cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' }).toDataURL('image/jpeg', 0.95);
            const idx = allPages.findIndex(p => p.id === currentEditingPageId);
            allPages[idx].currentData = croppedDataUrl;
            document.querySelector(`[data-id="${currentEditingPageId}"] .thumbnail-img`).src = croppedDataUrl;
            document.getElementById('modalImg').src = croppedDataUrl;
            cancelCrop();
        }
        function cancelCrop() {
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('cropperContainer').classList.add('hidden');
            document.getElementById('modalImageContainer').style.display = 'flex';
            document.getElementById('cropBtn').classList.remove('hidden');
            document.getElementById('confirmCropBtn').classList.add('hidden');
            document.getElementById('cancelCropBtn').classList.add('hidden');
        }
        function zoomIn() { currentZoom += 0.3; updateZoom(); }
        function zoomOut() { currentZoom = Math.max(0.4, currentZoom - 0.3); updateZoom(); }
        function updateZoom() { const img = document.getElementById('modalImg'); img.style.transform = `scale(${currentZoom})`; img.style.maxWidth = currentZoom > 1 ? 'none' : '100%'; }
        function closePreview() { cancelCrop(); document.getElementById('previewModal').style.display = 'none'; }
        
        // --- NUEVO: Lógica del Visor Estilo Chrome ---
        function openFullViewer() {
            const items = Array.from(pagesGrid.children);
            if (items.length === 0) return;
            
            const sidebar = document.getElementById('viewerSidebar');
            sidebar.innerHTML = ''; // Limpiar
            viewerZoom = 1; updateViewerZoom();
            
            document.getElementById('viewerTitle').innerText = nameNav.value || "Documento.pdf";
            document.getElementById('viewerTotalPages').innerText = items.length;

            items.forEach((item, index) => {
                const pageObj = allPages.find(p => p.id === item.dataset.id);
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'w-16 h-20 md:w-36 md:h-44 bg-white flex items-center justify-center cursor-pointer border border-transparent transition-all shadow-md relative';
                thumbDiv.onclick = () => selectViewerPage(pageObj.id, thumbDiv, index + 1);
                
                // Indicador de numero
                thumbDiv.innerHTML = `
                    <img id="thumb-${pageObj.id}" src="${pageObj.currentData}" class="object-contain w-full h-full p-1">
                    <div class="absolute -bottom-5 text-gray-400 text-[10px] md:text-xs text-center w-full">${index + 1}</div>
                `;
                sidebar.appendChild(thumbDiv);
                
                if (index === 0) selectViewerPage(pageObj.id, thumbDiv, 1); // Auto-seleccionar el primero
            });
            
            document.getElementById('fullViewerModal').classList.remove('hidden');
        }

        function selectViewerPage(pageId, element, pageNumber) {
            currentEditingPageId = pageId;
            document.getElementById('viewerMainImg').src = allPages.find(p => p.id === pageId).currentData;
            document.getElementById('viewerCurrentPage').innerText = pageNumber;
            
            // Estilos activo
            document.querySelectorAll('#viewerSidebar > div').forEach(el => el.classList.remove('thumb-active'));
            element.classList.add('thumb-active');
            
            // Auto scroll sidebar si es necesario
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function viewerZoomIn() { viewerZoom += 0.25; updateViewerZoom(); }
        function viewerZoomOut() { viewerZoom = Math.max(0.25, viewerZoom - 0.25); updateViewerZoom(); }
        function updateViewerZoom() {
            document.getElementById('viewerMainImg').style.transform = `scale(${viewerZoom})`;
            document.getElementById('viewerZoomLabel').innerText = `${Math.round(viewerZoom * 100)}%`;
        }
        function closeFullViewer() { document.getElementById('fullViewerModal').classList.add('hidden'); }

        function deletePage(id) { document.querySelector(`[data-id="${id}"]`).remove(); }
        function clearAll() { if(confirm("¿Borrar todos los documentos?")) { location.reload(); } }
    </script>
</body>
